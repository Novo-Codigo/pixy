name: Django CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    defaults:
        run:
            working-directory: ./api/pixy

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14.2'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pylint
      run: pylint . > .lintlog

    - name: Run Django Tests
      env:
        SECRET_KEY: 'django-insecure-test-key-ci-cd-pipeline'
        DEBUG: 'False'
        CI_ENV: 'true'
      run: python manage.py test